# Kubeconfig pointing at the API through the maas DNAT.
#
# Use when the cluster master FIP is NOT routable from this machine (see
# k8s-cluster-usage.md §5). Two hard rules:
#   1. NO `certificate-authority-data` line — clients ≥1.28 reject "root
#      certificates file with the insecure flag".
#   2. The file must be named exactly `config` if copied to ~/.kube/.

apiVersion: v1
kind: Config
preferences: {}
clusters:
- cluster:
    # certificate-authority-data: <do-not-add>
    server: https://203.0.113.137:6767
    insecure-skip-tls-verify: true
  name: k8s-test
contexts:
- context:
    cluster: k8s-test
    user: k8s-test
  name: k8s-test
current-context: k8s-test
users:
- name: k8s-test
  user:
    client-certificate-data: <keep-from-the-download>
    client-key-data: <keep-from-the-download>