# Token-based kubeconfig for the dashboard "kubeconfig" tab.
#
# Build from the magnum download (or `kubectl config view`) by replacing ONLY the
# user entry with the dashboard admin token (see kubernetes-dashboard.md Option 1a).
# Keep certificate-authority-data and server untouched.
#
# NOTE: the dashboard pod connects to `server` from INSIDE the cluster, so the API
# address must be the in-cluster master FIP — NOT a maas DNAT address.

apiVersion: v1
kind: Config
preferences: {}
clusters:
- cluster:
    certificate-authority-data: <keep-from-the-download>
    server: https://198.51.100.10:6443
  name: k8s-test
contexts:
- context:
    cluster: k8s-test
    user: dashboard-admin
  name: dashboard
current-context: dashboard
users:
- name: dashboard-admin
  user:
    token: <paste-token-from-step-1a>